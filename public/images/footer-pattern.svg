<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260" viewBox="0 0 260 260">
  <!--
    KGP PAWS footer pattern — original single-colour line art.

    Seamless by construction: every motif sits wholly inside the tile, so the
    260x260 square repeats without any edge seam. Drawn in currentColor-ish
    neutral and rendered at ~6% opacity by the footer, so it reads as texture
    rather than illustration and never competes with the text over it.
  -->
  <g fill="none" stroke="#FAFAF7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">

    <!-- ——— paw print ——— -->
    <g transform="translate(20 22)">
      <ellipse cx="0" cy="7" rx="7" ry="5.4"/>
      <ellipse cx="-7.5" cy="-2" rx="2.6" ry="3.5" transform="rotate(-18 -7.5 -2)"/>
      <ellipse cx="-2.6" cy="-6" rx="2.7" ry="3.8"/>
      <ellipse cx="2.6" cy="-6" rx="2.7" ry="3.8"/>
      <ellipse cx="7.5" cy="-2" rx="2.6" ry="3.5" transform="rotate(18 7.5 -2)"/>
    </g>

    <!-- ——— heart ——— -->
    <path d="M76 30c-5-4.4-9.4-7.6-9.4-12.2a5 5 0 0 1 9.4-2.6 5 5 0 0 1 9.4 2.6C85.4 22.4 81 25.6 76 30z"/>

    <!-- ——— dog, side view ——— -->
    <g transform="translate(122 16)">
      <path d="M0 20c0-6 3-9 8-9h14c4 0 6 2 8 5"/>
      <path d="M30 16c3-1 5 0 6 2 1 2 0 4-1 5l-1 1"/>
      <path d="M31 14c0-3 1-5 2-6"/>
      <circle cx="33.5" cy="18.5" r="0.9" fill="#FAFAF7" stroke="none"/>
      <path d="M0 20v9M8 20v9M18 20v9M26 21v8"/>
      <path d="M0 14c-3-2-5-5-4-8 2 1 4 3 4 5"/>
      <path d="M23 11c0-3 1-5 3-6"/>
    </g>

    <!-- ——— tree ——— -->
    <g transform="translate(216 24)">
      <path d="M0 30V14"/>
      <path d="M0 14c-7 0-12-5-12-11S-7-9 0-9s12 5 12 12-5 11-12 11z"/>
      <path d="M0 20l-5-5M0 24l5-5"/>
    </g>

    <!-- ——— cat, sitting ——— -->
    <g transform="translate(28 92)">
      <path d="M0 30c-4 0-7-3-7-8 0-6 3-10 3-14"/>
      <path d="M10 30c4 0 7-3 7-8 0-6-3-10-3-14"/>
      <path d="M-4 8c0-5 4-8 9-8s9 3 9 8-4 8-9 8-9-3-9-8z"/>
      <path d="M-3 3l-2-6 5 2M13 3l2-6-5 2"/>
      <path d="M17 22c4 2 6 5 5 8"/>
      <circle cx="1.5" cy="7" r="0.8" fill="#FAFAF7" stroke="none"/>
      <circle cx="8.5" cy="7" r="0.8" fill="#FAFAF7" stroke="none"/>
    </g>

    <!-- ——— cow ——— -->
    <g transform="translate(92 96)">
      <path d="M0 18c0-6 3-9 8-9h16c5 0 8 3 8 9"/>
      <path d="M32 14c3-2 6-1 7 1 1 3-1 5-3 6h-3"/>
      <path d="M31 11c-1-3 0-5 2-6M38 12c2-2 4-2 5 0"/>
      <path d="M0 18v9M9 18v9M20 18v9M29 20v7"/>
      <path d="M0 12c-3-1-5-4-4-7 2 1 4 3 4 5"/>
      <ellipse cx="12" cy="13" rx="3.5" ry="2.4"/>
      <circle cx="35" cy="18" r="0.9" fill="#FAFAF7" stroke="none"/>
    </g>

    <!-- ——— leaf ——— -->
    <g transform="translate(176 104)">
      <path d="M0 20c0-11 7-19 16-20 1 10-5 20-16 20z"/>
      <path d="M14 3C9 8 4 13 0 20"/>
    </g>

    <!-- ——— person walking a dog ——— -->
    <g transform="translate(24 170)">
      <circle cx="4" cy="2" r="3.6"/>
      <path d="M4 6v11"/>
      <path d="M4 17l-4 10M4 17l4 10"/>
      <path d="M4 9l7 4"/>
      <path d="M11 13c5 2 8 5 9 8" stroke-dasharray="2.5 2.5"/>
      <g transform="translate(20 21)">
        <path d="M0 4c0-3 2-4 4-4h8c2 0 3 1 4 3"/>
        <path d="M16 3c2-1 3 0 3 1 0 1-1 2-2 2"/>
        <path d="M0 4v5M5 4v5M11 4v5M15 5v4"/>
        <path d="M0 1c-2-1-3-2-2-4 1 1 2 2 2 3"/>
      </g>
    </g>

    <!-- ——— elephant ——— -->
    <g transform="translate(110 176)">
      <path d="M0 22c0-9 5-15 13-15h9c8 0 13 6 13 15"/>
      <path d="M35 14c2 3 2 7 1 10"/>
      <path d="M30 9c4-3 8-2 9 1 1 3-2 6-5 6"/>
      <path d="M36 20c1 5-1 9-4 10-2-4-1-8 1-10"/>
      <path d="M0 22v6M9 22v6M20 22v6M29 23v5"/>
      <path d="M0 16c-3-1-4-3-3-5"/>
      <circle cx="33" cy="13" r="0.9" fill="#FAFAF7" stroke="none"/>
    </g>

    <!-- ——— volunteer cradling an animal ——— -->
    <g transform="translate(196 168)">
      <circle cx="6" cy="3" r="3.8"/>
      <path d="M6 7c-5 0-8 3-8 8v6"/>
      <path d="M6 7c5 0 8 3 8 8"/>
      <path d="M-2 15c3 4 8 5 12 3"/>
      <ellipse cx="14" cy="19" rx="5.5" ry="4"/>
      <path d="M11 16l-1.5-3 3 1M17 16l1.5-3-3 1"/>
      <path d="M-2 21v7M4 21v7"/>
    </g>

    <!-- ——— small paw ——— -->
    <g transform="translate(72 74)">
      <ellipse cx="0" cy="4.5" rx="4.4" ry="3.4"/>
      <ellipse cx="-4.7" cy="-1.2" rx="1.7" ry="2.3"/>
      <ellipse cx="-1.6" cy="-3.7" rx="1.7" ry="2.4"/>
      <ellipse cx="1.6" cy="-3.7" rx="1.7" ry="2.4"/>
      <ellipse cx="4.7" cy="-1.2" rx="1.7" ry="2.3"/>
    </g>

    <!-- ——— small heart ——— -->
    <path d="M180 66c-3.4-3-6.4-5.2-6.4-8.3a3.4 3.4 0 0 1 6.4-1.8 3.4 3.4 0 0 1 6.4 1.8c0 3.1-3 5.3-6.4 8.3z"/>

    <!-- ——— sprigs / nature ——— -->
    <g transform="translate(228 128)">
      <path d="M0 26V4"/>
      <path d="M0 10c-4-1-6-4-6-7 3 0 6 2 6 5M0 17c4-1 6-4 6-7-3 0-6 2-6 5"/>
    </g>

    <!-- ——— paw trail ——— -->
    <g transform="translate(150 56)" opacity="0.9">
      <ellipse cx="0" cy="0" rx="3.4" ry="2.6"/>
      <ellipse cx="10" cy="6" rx="3.4" ry="2.6"/>
      <ellipse cx="20" cy="0" rx="3.4" ry="2.6"/>
    </g>

    <!-- ——— leaf pair ——— -->
    <g transform="translate(64 220)">
      <path d="M0 0c8 1 13 7 13 14C6 13 1 8 0 0z"/>
      <path d="M2 3c3 4 7 8 11 11"/>
    </g>

    <!-- ——— adoption moment: hands offering a heart ——— -->
    <g transform="translate(160 226)">
      <path d="M0 10c-3-2-4-5-3-8"/>
      <path d="M20 10c3-2 4-5 3-8"/>
      <path d="M10 12c-4-3.4-7.4-6-7.4-9.4a4 4 0 0 1 7.4-2 4 4 0 0 1 7.4 2C17.4 6 14 8.6 10 12z"/>
    </g>

    <!-- ——— tiny paw ——— -->
    <g transform="translate(112 240)">
      <ellipse cx="0" cy="3" rx="3.2" ry="2.5"/>
      <ellipse cx="-3.4" cy="-1" rx="1.3" ry="1.8"/>
      <ellipse cx="0" cy="-2.6" rx="1.3" ry="1.8"/>
      <ellipse cx="3.4" cy="-1" rx="1.3" ry="1.8"/>
    </g>

    <!-- ——— cat curled ——— -->
    <g transform="translate(224 200)">
      <path d="M0 14c-6 0-10-4-10-9s4-9 10-9 10 4 10 9"/>
      <path d="M10 5c4 1 6 4 5 7-1 2-4 3-6 2"/>
      <path d="M-6 -1l-2-5 5 2"/>
      <circle cx="-2" cy="1" r="0.8" fill="#FAFAF7" stroke="none"/>
    </g>

  </g>
</svg>
